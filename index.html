<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="Duas Maria — moda feminina com curadoria. Peças atemporais e de qualidade, com entrega para todo o Brasil e parcelamento em até 6x sem juros."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    />

    <!--
      Foto da capa: começa a baixar junto com o JS, sem esperar o React montar.
      Só na Home — em outras páginas seria peso à toa. Os nomes precisam bater
      com os de src/components/home/Hero.jsx.
    -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.fetchPriority = 'high';
        if (matchMedia('(min-width: 768px)').matches) {
          l.imageSrcset = '/hero/capa-1200-v1.webp 1200w, /hero/capa-1983-v1.webp 1983w';
          l.imageSizes = '100vw';
        } else {
          l.href = '/hero/capa-mobile-v1.webp';
        }
        document.head.appendChild(l);
      }
    </script>

    <title>Duas Maria | Moda feminina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
